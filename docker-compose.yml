services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mathmentor_db
    environment:
      POSTGRES_DB: mathmentor
      POSTGRES_USER: mathmentor_user
      POSTGRES_PASSWORD: mathmentor_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathmentor_user -d mathmentor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # YouTube PO Token provider (sidecar service)
  # Generates Proof-of-Origin tokens required by YouTube to bypass bot detection
  # from datacenter IPs. Used by yt-dlp via the bgutil-ytdlp-pot-provider plugin.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: mathmentor_bgutil_pot
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: mathmentor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: mathmentor_web
    command: flask run --host=0.0.0.0
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://mathmentor_user:mathmentor_password@db:5432/mathmentor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - SECRET_KEY=dev-secret-key-change-in-production
      - PYTHONUNBUFFERED=1
      # PO Token provider for yt-dlp (bypasses YouTube bot detection on datacenters)
      - getpot_bgutil_baseurl=http://bgutil-pot:4416
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./migrations:/app/migrations
      # Optional YouTube cookies for anti-bot bypass:
      # 1. Export cookies from your browser using an extension like
      #    "Get cookies.txt LOCALLY" (Netscape format)
      # 2. Save the file as ./cookies.txt in this directory
      # 3. Uncomment the line below
      # 4. Set YOUTUBE_COOKIES_FILE=/app/cookies.txt in .env
      # - ./cookies.txt:/app/cookies.txt:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      bgutil-pot:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
