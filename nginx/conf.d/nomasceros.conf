# Configuración inicial para obtener el certificado SSL
server {
    listen 80;
    listen [::]:80;
    server_name nomasceros.es www.nomasceros.es;

    # Aumentar límite de tamaño de archivos subidos
    client_max_body_size 200M;

    # Ubicación para el challenge de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Juego "Legend of Maths" (conector en :5055): /legend y su API /api/game
    location /legend {
        proxy_pass http://legend:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /api/game {
        proxy_pass http://legend:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Redirigir todo el demás tráfico a HTTPS (se descomentará después de obtener el certificado)
    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts extendidos para procesamiento de archivos grandes
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Buffering deshabilitado para archivos grandes
        proxy_buffering off;
        proxy_request_buffering off;
    }
    #location / {
    #    return 301 https://$host$request_uri;
    #}
}

# Esta configuración se descomentará DESPUÉS de obtener el certificado SSL
# Para obtener el certificado primero, ejecuta: ./init-letsencrypt.sh
#
 server {
     listen 443 ssl;
     listen [::]:443 ssl;
     http2 on;
     server_name nomasceros.es www.nomasceros.es;

     # Aumentar límite de tamaño de archivos subidos
     client_max_body_size 200M;
 
     # Certificados SSL
     ssl_certificate /etc/letsencrypt/live/nomasceros.es/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/nomasceros.es/privkey.pem;
     
     # Configuración SSL
     include /etc/nginx/ssl-params.conf;
 
     # Logs
     access_log /var/log/nginx/nomasceros_access.log;
     error_log /var/log/nginx/nomasceros_error.log;

     # Juego "Legend of Maths" (conector en :5055): /legend y su API /api/game
     location /legend {
         proxy_pass http://legend:5055;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_read_timeout 600s;
         proxy_send_timeout 600s;
     }
     location /api/game {
         proxy_pass http://legend:5055;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_read_timeout 600s;
         proxy_send_timeout 600s;
     }

     location / {
         proxy_pass http://web:5000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
         
         # WebSocket support (si lo necesitas)
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "upgrade";
#         
#         # Timeouts extendidos para procesamiento de archivos grandes
#         proxy_connect_timeout 600s;
#         proxy_send_timeout 600s;
#         proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

#         
         # Buffering deshabilitado para archivos grandes
         proxy_buffering off;
         proxy_request_buffering off;
     }
# 
