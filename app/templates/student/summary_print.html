<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen — {{ topic.topic_name if topic else 'MathMentor IA' }}</title>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1a202c;
            line-height: 1.7;
            max-width: 820px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            background: #fff;
        }
        .doc-header {
            border-bottom: 3px solid #6366f1;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .doc-header .brand {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #6366f1;
            margin-bottom: 0.3rem;
        }
        .doc-header h1 {
            font-size: 1.7rem;
            margin: 0;
            color: #1a202c;
        }
        .doc-header .meta {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 0.4rem;
        }
        .content h1, .content h2, .content h3 { color: #2d3748; margin-top: 1.6rem; }
        .content h2 { font-size: 1.35rem; }
        .content h3 { font-size: 1.15rem; }
        .content ul, .content ol { padding-left: 1.5rem; }
        .content li { margin-bottom: 0.4rem; }
        .content code {
            background: #f1f5f9;
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .content pre {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }
        .content blockquote {
            border-left: 4px solid #cbd5e0;
            margin-left: 0;
            padding-left: 1rem;
            color: #4a5568;
        }
        .print-bar {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        .print-bar button {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .print-bar .btn-print { background: #6366f1; color: #fff; }
        .print-bar .btn-back { background: #e2e8f0; color: #2d3748; }
        .doc-footer {
            margin-top: 3rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
        }
        @media print {
            .print-bar { display: none; }
            body { padding: 0; max-width: none; }
            a { color: inherit; text-decoration: none; }
        }
    </style>
</head>
<body>
    <div class="print-bar">
        <button class="btn-print" onclick="window.print()"><i></i>🖨️ Guardar como PDF</button>
        <button class="btn-back" onclick="window.close(); history.back();">Volver</button>
    </div>

    <div class="doc-header">
        <div class="brand">MathMentor IA · Resumen</div>
        <h1>{{ topic.topic_name if topic else 'Resumen' }}</h1>
        <div class="meta">Generado el {{ summary.generated_at.strftime('%d/%m/%Y') if summary.generated_at else '' }}</div>
    </div>

    <div id="content" class="content"></div>

    <div class="doc-footer">MathMentor IA — Documento de estudio personal</div>

    <script>
        const rawContent = {{ summary.content|tojson|safe }};

        // Protege el LaTeX para que marked no lo altere
        function mdMath(text) {
            text = text || '';
            const store = [];
            const stash = (m) => '@@MJX' + (store.push(m) - 1) + '@@';
            text = text.replace(/\$\$[\s\S]+?\$\$/g, stash);
            text = text.replace(/\\\[[\s\S]+?\\\]/g, stash);
            text = text.replace(/\\\([\s\S]+?\\\)/g, stash);
            text = text.replace(/\$(?![\s$])(?:\\\$|[^$\n])+?\$/g, stash);
            let html = marked.parse(text);
            return html.replace(/@@MJX(\d+)@@/g, (m, i) => store[Number(i)]);
        }

        marked.setOptions({ breaks: true, gfm: true });
        document.getElementById('content').innerHTML = mdMath(rawContent);

        // Espera a que MathJax renderice las fórmulas y abre el diálogo de impresión
        function typesetAndPrint() {
            if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
                MathJax.startup.promise
                    .then(() => MathJax.typesetPromise([document.getElementById('content')]))
                    .then(() => { if (!window.location.hash.includes('noprint')) window.print(); })
                    .catch((e) => { console.log('MathJax error:', e); window.print(); });
            } else {
                setTimeout(typesetAndPrint, 200);
            }
        }
        window.addEventListener('load', typesetAndPrint);
    </script>
</body>
</html>
